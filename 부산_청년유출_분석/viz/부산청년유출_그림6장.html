<div id="tip"></div>
<div class="wrap">
<h1>부산 청년 유출 — 핵심 그림 6장</h1>
<p class="sub">국내인구이동통계 2025 · 고용24 2025.08~2026.07 · GOMS 2019 · 전국사업체조사 2024 · 사업체노동력조사 2025 · 부산 청년정책 시행계획 2025</p>

<figure><figcaption><div class="ft">1. 부산은 20대 초반을 모으고, 20대 후반에 잃는다</div>
<div class="fs">부산 연령별 순이동, 2025년 (명)</div></figcaption>
<div class="scroll"><svg id="c1" viewBox="0 0 860 320" width="100%" preserveAspectRatio="xMinYMin meet"></svg></div>
<div class="lg"><span><i style="background:var(--pos)"></i>순유입</span><span><i style="background:var(--neg)"></i>순유출</span></div>
<p class="note"><span class="key">20-24세 +927 → 25-29세 −5,437.</span> 전환폭 −6,364는 2위 대전(−1,836)의 3.5배다.
20-24세가 순유입인 비수도권 광역시는 부산뿐이다. 이 구간 하나가 부산 전체 순유출의 44.6%를 차지한다.</p>
<details><summary>데이터 보기</summary><div id="t1"></div></details></figure>

<figure><figcaption><div class="ft">2. 이유는 집값이 아니라 직업이다</div>
<div class="fs">부산 전입사유별 순이동, 2025년 (명)</div></figcaption>
<div class="scroll"><svg id="c2" viewBox="0 0 860 260" width="100%" preserveAspectRatio="xMinYMin meet"></svg></div>
<div class="lg"><span><i style="background:var(--pos)"></i>순유입</span><span><i style="background:var(--neg)"></i>순유출</span></div>
<p class="note"><span class="key">직업 −9,063으로 순유출의 74.4%.</span> 주택은 17.4%에 그친다.
교육은 +3,479 순유입 — 다만 대부분 대학 입학이며 대학의 경쟁력을 뜻하지 않는다.</p>
<details><summary>데이터 보기</summary><div id="t2"></div></details></figure>

<figure><figcaption><div class="ft">3. 배출과 수요의 엇갈린 결</div>
<div class="fs">직종 대분류별 구성비 (%) · 졸업자 2024, 공공 구인 2025.08~2026.07, 민간 공고 2026-09-07</div></figcaption>
<div class="scroll"><svg id="c3" viewBox="0 0 860 470" width="100%" preserveAspectRatio="xMinYMin meet"></svg></div>
<div class="lg"><span><i style="background:var(--c1)"></i>졸업자 배출</span><span><i style="background:var(--c2)"></i>공공채널 수요</span><span><i style="background:var(--c3)"></i>민간채널 수요</span></div>
<p class="note">채널에 따라 수요 비중이 2배까지 달라지므로 <span class="key">절대 비중이 아니라 배출과의 어긋남</span>을 본다.
114개 시나리오 전부에서 부호가 유지되는 직종은 6개 — 과잉(연구·공학, 예술·디자인, 교육·법률·복지)과 과소(미용·돌봄, 설치·정비·생산, 영업·판매·운송)다.</p>
<details><summary>데이터 보기</summary><div id="t3"></div></details></figure>

<figure><figcaption><div class="ft">4. 대졸이 가는 직종일수록 자리가 없다</div>
<div class="fs">부산 직종별 구인배수와 대졸요구율 · 원 크기 = 부산 노동수요 비중</div></figcaption>
<div class="scroll"><svg id="c4" viewBox="0 0 860 420" width="100%" preserveAspectRatio="xMinYMin meet"></svg></div>
<p class="note"><span class="key">구인배수 = 신규구인인원 ÷ 신규구직건수.</span> 1 미만이면 구직자가 자리보다 많다.
예술·디자인 0.06은 구직자 16명당 자리 1개다. 순위상관 −0.66.
단 분모가 전 연령·전 학력 구직자이므로 <span class="key">직종 간 상대 비교로만</span> 읽는다.</p>
<details><summary>데이터 보기</summary><div id="t4"></div></details></figure>

<figure><figcaption><div class="ft">5. 떠나서 이득이 있는 전공만 떠난다</div>
<div class="fs">부산 소재 대학 졸업자 · 전공계열별 부산 이탈률과 임금 프리미엄 (GOMS 2019, 개인특성 통제 후)</div></figcaption>
<div class="scroll"><svg id="c5" viewBox="0 0 860 400" width="100%" preserveAspectRatio="xMinYMin meet"></svg></div>
<div class="lg"><span><i style="background:var(--c1)"></i>통계적으로 유의</span><span><i style="background:var(--s1);border:1.5px solid var(--c1)"></i>유의하지 않음</span></div>
<p class="note"><span class="key">공학만 +23.7%로 유의(t=4.31)하고, 이탈률도 60.2%로 최고다.</span>
의약은 +1.1%(무의미)이고 이탈률도 32.5%로 최저. 예체능·인문은 떠나도 오르지 않아 남고, 남아서 월 177~196만원을 받는다.
전체 표본으로는 통제 후에도 +14.2%(t=4.22)가 남는다.</p>
<details><summary>데이터 보기</summary><div id="t5"></div></details></figure>

<figure><figcaption><div class="ft">6. 문제는 수요인데, 정책은 배출을 늘리는 쪽에 있다</div>
<div class="fs">2025년 부산광역시 청년정책 95개 사업 4,146억원 · 분야별 예산 비중</div></figcaption>
<div class="scroll"><svg id="c6" viewBox="0 0 860 290" width="100%" preserveAspectRatio="xMinYMin meet"></svg></div>
<p class="note"><span class="key">유출 사유의 74.4%가 직업인데 예산의 12.8%만 일자리에 간다. 57.6%는 교육이다.</span>
대졸 직종 관련 16개 사업 중 <span class="key">14개가 인력 양성, 수요·매칭은 2개</span>다.
다만 교육 예산의 77.1%가 국비여서, 부산시 진단이라기보다 중앙 공모사업 구조의 결과일 수 있다. (비중은 게재 금액에서 계산한 값이며, 시행계획 원문 표기는 각각 57.5%·13%다.)</p>
<details><summary>데이터 보기</summary><div id="t6"></div></details></figure>
</div>
<script>const D={"age": {"labels": ["0-4세", "5-9세", "10-14세", "15-19세", "20-24세", "25-29세", "30-34세", "35-39세", "40-44세", "45-49세", "50-54세", "55-59세", "60-64세", "65-69세", "70-74세", "75-79세", "80세이상"], "values": [265, 141, -96, 556, 927, -5437, -2236, -482, -323, -670, -709, -1070, -1206, -801, -458, -269, -313]}, "reason": {"labels": ["직업", "가족", "주택", "자연환경", "기타", "주거환경", "교육"], "values": [-9063, -3359, -2118, -1223, -812, 915, 3479]}, "mismatch": {"labels": ["경영·사무·금융·보험", "연구·공학기술", "보건·의료", "교육·법률·사회복지·경찰·소방", "예술·디자인·방송·스포츠", "설치·정비·생산", "영업·판매·운전·운송", "건설·채굴", "미용·여행·숙박·음식·경비·돌봄·청소", "농림어업"], "grad": [28.5, 18.9, 14.1, 13.8, 13.2, 6.8, 2.2, 1.1, 1.0, 0.4], "pub": [11.7, 3.2, 2.8, 7.7, 0.8, 18.8, 6.3, 2.6, 44.9, 1.3], "priv": [24.6, 9.0, 13.4, 5.8, 3.5, 15.9, 11.2, 0.3, 15.9, 0.3]}, "ratio": {"labels": ["경영·사무·금융·보험", "연구·공학기술", "보건·의료", "교육·법률·사회복지·경찰·소방", "예술·디자인·방송·스포츠", "설치·정비·생산", "영업·판매·운전·운송", "건설·채굴", "미용·여행·숙박·음식·경비·돌봄·청소", "농림어업"], "jobratio": [0.18, 0.14, 0.16, 0.35, 0.06, 0.5, 0.27, 0.22, 0.59, 0.5], "degree": [28.6, 45.2, 42.3, 55.7, 22.1, 7.6, 20.6, 11.0, 4.2, 7.1], "demand": [11.7, 3.2, 2.8, 7.7, 0.8, 18.8, 6.3, 2.6, 44.9, 1.3]}, "goms": {"labels": ["공학", "인문", "자연", "교육", "예체능", "사회", "의약"], "leave": [60.2, 44.2, 43.1, 39.5, 39.2, 38.7, 32.5], "premium": [23.72, 5.3, 17.29, 18.92, 4.06, 8.05, 1.11], "sig": [true, false, false, false, false, false, false]}, "policy": {"labels": ["교육", "주거", "일자리", "복지·문화", "참여·권리"], "budget": [238708, 73269, 53069, 46484, 3076], "count": [26, 12, 26, 19, 12]}, "region": {"labels": ["광주", "부산", "전북", "경북", "대구", "강원", "제주", "전남", "경남", "대전", "경기", "울산", "충남", "충북", "서울", "인천", "세종"], "a2024": [-2064, 927, -2849, -5842, -1659, -2293, -1590, -3790, -7496, 2042, 2486, -1740, -2343, -546, 25664, 1572, -479], "a2529": [-3163, -5437, -2590, -2997, -3225, -1472, -608, -1304, -1633, 206, 4953, 586, 1210, 996, 10273, 3432, 773]}};
const NS="http://www.w3.org/2000/svg", tip=document.getElementById("tip");
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
const fmt=n=>n.toLocaleString("ko-KR");
function hov(node,html){
  node.style.cursor="default";
  node.addEventListener("pointerenter",e=>{tip.innerHTML=html;tip.style.opacity=1});
  node.addEventListener("pointermove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-200)+"px";tip.style.top=(e.clientY-12)+"px"});
  node.addEventListener("pointerleave",()=>tip.style.opacity=0);
}
// 막대 끝만 둥글게(baseline 고정) — 세로 막대용 path
function vbar(x,y,w,h,r,up){ r=Math.min(r,w/2,h);
  return up ? `M${x},${y+h}V${y+r}a${r},${r} 0 0 1 ${r},-${r}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}V${y+h}Z`
            : `M${x},${y}V${y+h-r}a${r},${r} 0 0 0 ${r},${r}h${w-2*r}a${r},${r} 0 0 0 ${r},-${r}V${y}Z`;}
function hbar(x,y,w,h,r,right){ r=Math.min(r,h/2,w);
  return right ? `M${x},${y}h${w-r}a${r},${r} 0 0 1 ${r},${r}v${h-2*r}a${r},${r} 0 0 1 ${-r},${r}h${-(w-r)}Z`
               : `M${x+w},${y}h${-(w-r)}a${r},${r} 0 0 0 ${-r},${r}v${h-2*r}a${r},${r} 0 0 0 ${r},${r}h${w-r}Z`;}
function table(id,head,rows){
  const h="<table><tr>"+head.map(x=>`<th>${x}</th>`).join("")+"</tr>"+
    rows.map(r=>"<tr>"+r.map((c,i)=>`<td>${c}</td>`).join("")+"</tr>").join("")+"</table>";
  document.getElementById(id).innerHTML=h;
}

/* ── 1. 연령별 순이동 (발산 세로막대) ── */
(()=>{const s=document.getElementById("c1"),W=860,H=320,M={t:26,r:14,b:52,l:56},d=D.age;
 const iw=W-M.l-M.r, ih=H-M.t-M.b, n=d.values.length, bw=iw/n*0.66, gap=iw/n;
 const mx=Math.max(...d.values.map(Math.abs)), y0=M.t+ih*(mx/(mx*1.15+mx))*1.0;
 const sc=v=>ih/(mx*2.1)*v, zero=M.t+ih*0.28;
 [ -4000,-2000,0,2000 ].forEach(g=>{const y=zero-sc(g);
   s.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:y,y2:y,stroke:"var(--grid)","stroke-width":g===0?1.5:1}));
   s.appendChild(Object.assign(el("text",{x:M.l-8,y:y+4,"text-anchor":"end",class:"ax"}),{textContent:fmt(g)}));});
 d.values.forEach((v,i)=>{const x=M.l+gap*i+(gap-bw)/2, up=v>0, h=Math.abs(sc(v));
   const key=["20-24세","25-29세"].includes(d.labels[i]);
   const p=el("path",{d:vbar(x,up?zero-h:zero,bw,h,3,up),fill:up?"var(--pos)":"var(--neg)",opacity:key?1:.42});
   hov(p,`<b>${d.labels[i]}</b><br>${v>0?"+":""}${fmt(v)}명`); s.appendChild(p);
   if(key){s.appendChild(Object.assign(el("text",{x:x+bw/2,y:up?zero-h-8:zero+h+16,"text-anchor":"middle",class:"vlb"}),{textContent:(v>0?"+":"")+fmt(v)}));}
   const t=el("text",{x:x+bw/2,y:H-M.b+16,"text-anchor":"end",class:"ax",transform:`rotate(-42 ${x+bw/2} ${H-M.b+16})`});
   t.textContent=d.labels[i].replace("세",""); if(key)t.setAttribute("fill","var(--tp)"); s.appendChild(t);});
 table("t1",["연령","순이동(명)"],d.labels.map((l,i)=>[l,fmt(d.values[i])]));})();

/* ── 2. 전입사유별 (발산 가로막대) ── */
(()=>{const s=document.getElementById("c2"),W=860,H=260,M={t:16,r:24,b:34,l:96},d=D.reason;

 const neg=Math.abs(Math.min(...d.values)), pos=Math.max(...d.values), PAD=64;

   const p=el("path",{d:hbar(right?zx:zx-w,y,w,bh,3,right),fill:right?"var(--pos)":"var(--neg)",opacity:key?1:.5});
   hov(p,`<b>${d.labels[i]}</b><br>${v>0?"+":""}${fmt(v)}명`); s.appendChild(p);
   s.appendChild(Object.assign(el("text",{x:M.l-10,y:y+bh/2+4,"text-anchor":"end",class:key?"vlb":"axl"}),{textContent:d.labels[i]}));
   s.appendChild(Object.assign(el("text",{x:right?zx+w+8:zx-w-8,y:y+bh/2+4,"text-anchor":right?"start":"end",class:key?"vlb":"vl"}),{textContent:(v>0?"+":"")+fmt(v)}));});
 table("t2",["사유","순이동(명)"],d.labels.map((l,i)=>[l,fmt(d.values[i])]));})();

/* ── 3. 배출 vs 수요 (그룹 가로막대) ── */
(()=>{const s=document.getElementById("c3"),W=860,H=470,M={t:14,r:56,b:34,l:186},d=D.mismatch;
 const iw=W-M.l-M.r, ih=H-M.t-M.b, n=d.labels.length, gap=ih/n, bh=gap*0.22;
 const mx=50, sc=v=>iw/mx*v, S=[["grad","var(--c1)"],["pub","var(--c2)"],["priv","var(--c3)"]];
 [0,10,20,30,40,50].forEach(g=>{const x=M.l+sc(g);
   s.appendChild(el("line",{x1:x,x2:x,y1:M.t,y2:M.t+ih,stroke:"var(--grid)"}));
   s.appendChild(Object.assign(el("text",{x:x,y:H-12,"text-anchor":"middle",class:"ax"}),{textContent:g+"%"}));});
 d.labels.forEach((lab,i)=>{const yb=M.t+gap*i+(gap-bh*3-4)/2;
  S.forEach(([k,c],j)=>{const v=d[k][i], y=yb+j*(bh+2), w=Math.max(sc(v),1.5);
   const p=el("path",{d:hbar(M.l,y,w,bh,2.5,true),fill:c});
   hov(p,`<b>${lab}</b><br>${({grad:"졸업자 배출",pub:"공공채널 수요",priv:"민간채널 수요"})[k]} ${v}%`); s.appendChild(p);
   if(v>=8)s.appendChild(Object.assign(el("text",{x:M.l+w+6,y:y+bh/2+3.5,class:"vl"}),{textContent:v.toFixed(1)}));});
  s.appendChild(Object.assign(el("text",{x:M.l-10,y:yb+bh*1.5+4,"text-anchor":"end",class:"axl"}),{textContent:lab}));});
 table("t3",["직종","졸업자%","공공수요%","민간수요%"],d.labels.map((l,i)=>[l,d.grad[i],d.pub[i],d.priv[i]]));})();

/* ── 4. 구인배수 × 대졸요구율 (버블) ── */
(()=>{const s=document.getElementById("c4"),W=860,H=420,M={t:20,r:26,b:52,l:64},d=D.ratio;
 const iw=W-M.l-M.r, ih=H-M.t-M.b, X=v=>M.l+iw/60*v, Y=v=>M.t+ih-ih/0.65*v, R=v=>4+Math.sqrt(v)*3.4;
 [0,.1,.2,.3,.4,.5,.6].forEach(g=>{const y=Y(g);
   s.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:y,y2:y,stroke:"var(--grid)"}));
   s.appendChild(Object.assign(el("text",{x:M.l-8,y:y+4,"text-anchor":"end",class:"ax"}),{textContent:g.toFixed(2)}));});
 [0,10,20,30,40,50,60].forEach(g=>{const x=X(g);
   s.appendChild(Object.assign(el("text",{x:x,y:H-30,"text-anchor":"middle",class:"ax"}),{textContent:g+"%"}));});
 s.appendChild(Object.assign(el("text",{x:M.l+iw/2,y:H-8,"text-anchor":"middle",class:"axl"}),{textContent:"대졸 이상 요구율 →"}));
 s.appendChild(Object.assign(el("text",{x:14,y:M.t+ih/2,"text-anchor":"middle",class:"axl",transform:`rotate(-90 14 ${M.t+ih/2})`}),{textContent:"구인배수 (자리 ÷ 구직자) →"}));
 d.labels.forEach((lab,i)=>{const x=X(d.degree[i]),y=Y(d.jobratio[i]),r=R(d.demand[i]);
   const c=el("circle",{cx:x,cy:y,r:r,fill:"var(--c1)","fill-opacity":.62,stroke:"var(--s1)","stroke-width":2});
   hov(c,`<b>${lab}</b><br>구인배수 ${d.jobratio[i]}<br>대졸요구율 ${d.degree[i]}%<br>수요비중 ${d.demand[i]}%`); s.appendChild(c);
   const short=lab.split("·")[0]+(lab.includes("미용")?"·돌봄":"");
   const below=lab.startsWith("농림");           // 설치·정비·생산과 겹쳐 아래로 내린다
   s.appendChild(Object.assign(el("text",{x:x,y:below?y+r+13:y-r-6,"text-anchor":"middle",class:"vl"}),{textContent:short}));});
 table("t4",["직종","구인배수","대졸요구율%","수요비중%"],d.labels.map((l,i)=>[l,d.jobratio[i],d.degree[i],d.demand[i]]));})();

/* ── 5. 이탈률 × 임금 프리미엄 ── */
(()=>{const s=document.getElementById("c5"),W=860,H=400,M={t:22,r:30,b:54,l:66},d=D.goms;
 const iw=W-M.l-M.r, ih=H-M.t-M.b, X=v=>M.l+iw/70*(v-25), Y=v=>M.t+ih-ih/28*v;
 [0,5,10,15,20,25].forEach(g=>{const y=Y(g);
   s.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:y,y2:y,stroke:"var(--grid)"}));
   s.appendChild(Object.assign(el("text",{x:M.l-8,y:y+4,"text-anchor":"end",class:"ax"}),{textContent:"+"+g+"%"}));});
 [30,40,50,60].forEach(g=>{const x=X(g);
   s.appendChild(Object.assign(el("text",{x:x,y:H-32,"text-anchor":"middle",class:"ax"}),{textContent:g+"%"}));});
 s.appendChild(Object.assign(el("text",{x:M.l+iw/2,y:H-10,"text-anchor":"middle",class:"axl"}),{textContent:"부산 이탈률 (첫 일자리가 부산 밖) →"}));
 s.appendChild(Object.assign(el("text",{x:15,y:M.t+ih/2,"text-anchor":"middle",class:"axl",transform:`rotate(-90 15 ${M.t+ih/2})`}),{textContent:"떠났을 때 임금 프리미엄 →"}));
 d.labels.forEach((lab,i)=>{const x=X(d.leave[i]),y=Y(d.premium[i]),sig=d.sig[i];
   const c=el("circle",{cx:x,cy:y,r:sig?11:8,fill:sig?"var(--c1)":"var(--s1)",stroke:"var(--c1)","stroke-width":sig?2:1.8});
   hov(c,`<b>${lab}</b><br>이탈률 ${d.leave[i]}%<br>임금 프리미엄 +${d.premium[i]}%<br>${sig?"통계적으로 유의":"유의하지 않음"}`); s.appendChild(c);
   s.appendChild(Object.assign(el("text",{x:x,y:y-(sig?16:13),"text-anchor":"middle",class:sig?"vlb":"vl"}),{textContent:lab}));});
 table("t5",["전공","이탈률%","임금프리미엄%","유의"],d.labels.map((l,i)=>[l,d.leave[i],"+"+d.premium[i],d.sig[i]?"O":"—"]));})();

/* ── 6. 정책 예산 ── */
(()=>{const s=document.getElementById("c6"),W=860,H=290,M={t:18,r:150,b:34,l:96},d=D.policy;
 const tot=d.budget.reduce((a,b)=>a+b,0), iw=W-M.l-M.r, ih=H-M.t-M.b, gap=ih/d.labels.length, bh=gap*0.56;
 const sc=v=>iw/60*(v/tot*100);
 [0,10,20,30,40,50,60].forEach(g=>{const x=M.l+sc(tot*g/100);
   s.appendChild(el("line",{x1:x,x2:x,y1:M.t,y2:M.t+ih,stroke:"var(--grid)"}));
   s.appendChild(Object.assign(el("text",{x:x,y:H-12,"text-anchor":"middle",class:"ax"}),{textContent:g+"%"}));});
 d.labels.forEach((lab,i)=>{const y=M.t+gap*i+(gap-bh)/2,v=d.budget[i],pct=v/tot*100,w=Math.max(sc(v),2);
   const key=["교육","일자리"].includes(lab);
   const p=el("path",{d:hbar(M.l,y,w,bh,3,true),fill:lab==="교육"?"var(--c2)":lab==="일자리"?"var(--c1)":"var(--grid)"});
   hov(p,`<b>${lab}</b><br>${fmt(v)}백만원 (${pct.toFixed(1)}%)<br>${d.count[i]}개 사업`); s.appendChild(p);
   s.appendChild(Object.assign(el("text",{x:M.l-10,y:y+bh/2+4,"text-anchor":"end",class:key?"vlb":"axl"}),{textContent:lab}));
   s.appendChild(Object.assign(el("text",{x:M.l+w+8,y:y+bh/2+4,class:key?"vlb":"vl"}),{textContent:pct.toFixed(1)+"%  ("+d.count[i]+"개)"}));});
 table("t6",["분야","예산(백만원)","비중%","사업수"],d.labels.map((l,i)=>[l,fmt(d.budget[i]),(d.budget[i]/tot*100).toFixed(1),d.count[i]]));})();
</script>
